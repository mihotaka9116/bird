<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon poème</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bubbles-container"></div>

    <header>
        <a href="#" class="logo">
            <i data-lucide="bird"></i> <span>Mon poème</span>
        </a>
        
        <button class="menu-toggle" id="menu-toggle" aria-label="メニューを開く">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <nav id="nav-menu">
            <ul>
                <li><a href="#concept">Concept</a></li>
                <li><a href="#poem-section">名言集</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero">
        <div class="hero-content">
            <i data-lucide="bird" class="hero-bird"></i>
            <h1>Mon poème</h1>
        </div>
    </div>

    <main>
        <section id="concept">
            <h2>Concept <i data-lucide="feather" class="section-feather"></i></h2>
            <p>印象に残った言葉たちが、泡のように浮かぶ場所。</p>
        </section>

        <section id="poem-section">
            <h2 class="section-title">名言集 <i data-lucide="feather" class="section-feather"></i></h2>
            <p style="font-size: 0.8rem; opacity: 0.7;">名前をクリックして言葉をひらく</p>
            
            <div class="poem-grid">
                <div class="poem-card clickable-card">
                    <p class="poem-author">― 寺山修司</p>
                    <div class="hidden-content">
                        <p class="poem-text">なみだはにんげんの<br>一ばん小さな海です</p>
                    </div>
                </div>

                <div class="poem-card clickable-card">
                    <p class="poem-author">― サン＝テグジュペリ</p>
                    <div class="hidden-content">
                        <p class="poem-text">心で見なくちゃ、ものごとはよく見えないってことさ。<br>かんじんなことは、目に見えないんだよ。</p>
                    </div>
                </div>

                <div class="poem-card clickable-card">
                    <p class="poem-author">― 夏目漱石</p>
                    <div class="hidden-content">
                        <p class="poem-text">月が綺麗ですね</p>
                    </div>
                </div>
